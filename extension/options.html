<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Messenger Read Sync</title>
<style>
  body { font-family: sans-serif; max-width: 32rem; padding: 1rem; }
  input { width: 100%; padding: .4rem; margin-bottom: .75rem; box-sizing: border-box; }
  label { display: block; font-weight: bold; margin-bottom: .25rem; }
  button { padding: .4rem 1rem; }
  #status { color: green; margin-left: .5rem; }
</style>
</head>
<body>
  <label for="phoneUrl">Phone URL</label>
  <input id="phoneUrl" placeholder="http://192.168.1.50:8765/read">
  <label for="token">Token (optional, must match app setting)</label>
  <input id="token" placeholder="shared secret">
  <button id="save">Save</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
